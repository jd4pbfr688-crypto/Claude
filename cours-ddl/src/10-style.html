<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* Charte du brief : la seule palette du fichier. Fond blanc, aucune autre couleur. */
  :root {
    color-scheme: light;
    --bg:        #FFFFFF;
    --ink:       #1F2937;   /* texte principal, axes */
    --blue:      #3B82F6;   /* individus : remplissage */
    --blue-dk:   #1E40AF;   /* individus : contour */
    --orange:    #F28C28;   /* moyennes mₑ : remplissage */
    --orange-dk: #C2410C;   /* moyennes mₑ : contour, texte */
    --pop:       #4B5563;   /* population inconnue : gris foncé, pointillés 8/6 */
    --green:     #16A34A;   /* estimation retenue */
    --red:       #DC2626;   /* slide 5 : les queues α/2 */
    --grid:      #E5E7EB;   /* grille, éléments estompés */
    --guide:     #F3F4F6;   /* repères verticaux, fonds très clairs */
    --font: "Inter", "Source Sans 3", Calibri, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease-expo: cubic-bezier(.82,0,.18,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }

  #viewport { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  body:not(.deck-ready) #world { visibility: hidden; }

  .station { position: absolute; width: 1920px; height: 1080px; background: var(--bg); }
  /* in the overview, frames need an edge on a white plane */
  body.is-overview .station { outline: 3px solid var(--grid); }
  .station.dormant[data-poster] { background-size: cover; background-position: center; }
  .station-error { font-size: 28px; opacity: .6; padding: 80px; }

  /* ---------- the stage: one SVG per station ---------- */
  .stage { position: absolute; inset: 0; display: block; overflow: visible; }
  .stage text { fill: var(--ink); font-family: var(--font); }
  .stage * { transform-box: fill-box; transform-origin: 50% 50%; }
  /* elements placed with an SVG transform attribute keep plain SVG transform semantics */
  .stage [transform] { transform-box: view-box; transform-origin: 0 0; }
  .stage .grow  { transform-origin: 50% 100%; }
  .stage .growx { transform-origin: 0% 50%; }
  .stage .t-title { font-size: 44px; font-weight: 700; }
  .stage .t-ax    { font-size: 26px; }
  .stage .t-tick  { font-size: 22px; }
  .stage .t-ann   { font-size: 30px; }
  .stage .t-28    { font-size: 28px; }
  .stage .t-or    { fill: var(--orange-dk); }
  .stage .t-pop   { fill: var(--pop); }
  .stage .t-green { fill: var(--green); }
  .stage .t-blue  { fill: var(--blue-dk); }
  .stage .halo    { paint-order: stroke; stroke: var(--bg); stroke-width: 7px; stroke-linejoin: round; }

  .stage .sq   { fill: var(--blue); stroke: var(--blue-dk); stroke-width: 1.5; }
  .stage .sqg  { fill: var(--blue); fill-opacity: .25; stroke: none; }
  .stage .sqo  { fill: var(--orange); stroke: var(--orange-dk); stroke-width: 1.5; }
  .stage .tok  { fill: var(--orange); stroke: var(--orange-dk); stroke-width: 1.5; }
  .stage .chip { fill: var(--bg); stroke: var(--orange); stroke-width: 1.5; }
  .stage .gridl { stroke: var(--grid); stroke-width: 1.5; }
  .stage .basel { stroke: var(--ink); stroke-width: 1.5; }
  .stage .guide { stroke: var(--guide); stroke-width: 2; }
  .stage .axl   { stroke: var(--ink); stroke-width: 2; }
  .stage .mline { stroke: var(--orange); stroke-width: 3; }
  .stage .mtri  { fill: var(--orange); stroke: var(--orange-dk); stroke-width: 1.5; stroke-linejoin: round; }
  .stage .mext  { stroke: var(--orange); stroke-width: 1.5; stroke-dasharray: 6 6; }
  /* the same mean, read as the estimate m (aide 3bis-c) */
  .stage .est .mline, .stage .mext.est { stroke: var(--green); }
  .stage .est .mtri { fill: var(--green); stroke: #15803D; }
  .station:is([data-key="ECHANT"], [data-key="UN"]) .stage .t-or { fill: var(--green); }
  .station:is([data-key="ECHANT"], [data-key="UN"]) .stage :is(.mline, .bell, .oarr) { stroke: var(--green); }
  .station:is([data-key="ECHANT"], [data-key="UN"]) .stage .mext { stroke: var(--green); }
  .station:is([data-key="ECHANT"], [data-key="UN"]) .stage :is(.mtri, .sqo, .tok) { fill: var(--green); stroke: #15803D; }
  .station:is([data-key="ECHANT"], [data-key="UN"]) .stage .chip { stroke: var(--green); }
  .station:is([data-key="ECHANT"], [data-key="UN"]) .stage .oarr-h { fill: var(--green); }
  .station:is([data-key="ECHANT"], [data-key="UN"]) .stage .bell.mu { stroke: var(--ink); }
  .stage .pop   { stroke: var(--pop); stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
  .stage .popbox { stroke: var(--pop); stroke-width: 2.5; stroke-dasharray: 8 6; fill: var(--bg); }
  .stage .box   { fill: var(--bg); stroke: var(--grid); stroke-width: 2; }
  .stage .nobox { display: none; }
  .stage .card  { fill: var(--bg); stroke: var(--grid); stroke-width: 3; }
  .stage .hl    { fill: var(--grid); }
  .stage .dot   { fill: var(--blue); stroke: var(--blue-dk); stroke-width: 1; }
  .stage .potato { fill: none; stroke: var(--pop); stroke-width: 3; }
  .stage .lasso { fill: none; stroke: var(--blue-dk); stroke-width: 3; }
  .stage .arrow { fill: none; stroke: var(--blue-dk); stroke-width: 2.5; }
  .stage .ahead { fill: var(--blue-dk); }
  .stage .ahead-ink { fill: var(--ink); }
  .stage .hand rect { fill: var(--bg); stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .stage .hand rect.on { fill: var(--blue); stroke: var(--blue-dk); }
  .stage .ruler { fill: var(--bg); stroke: var(--ink); stroke-width: 2.5; }
  .stage .rtick { stroke: var(--ink); stroke-width: 2; }
  .stage .pile  { fill: var(--grid); stroke: var(--bg); stroke-width: 3; }
  .stage .bell  { fill: none; stroke: var(--orange-dk); stroke-width: 3; }
  .stage .thin  { stroke: var(--pop); stroke-width: 1.5; }
  .stage .banner { fill: var(--guide); }
  .stage .barr  { stroke: var(--blue); stroke-width: 3; }
  .stage .barr-h { fill: var(--blue); }
  .stage .oarr  { stroke: var(--orange); stroke-width: 3; }
  .stage .oarr-h { fill: var(--orange); }
  .stage .sw-green { fill: var(--green); }
  .stage .row-solid { fill: none; stroke: var(--grid); stroke-width: 2; }
  .stage .band-or { fill: var(--orange); }
  .stage .band-gr { fill: var(--green); }
  .stage .band-pop { stroke: var(--pop); stroke-width: 16; stroke-dasharray: 8 6; }
  .stage .colhl { fill: var(--guide); }
  .stage .vline { stroke: var(--ink); stroke-width: 2; }
  .stage .t-red { fill: var(--red); }
  .stage .ic-area-g  { fill: var(--green); fill-opacity: .14; }
  .stage .ic-curve-g { fill: none; stroke: var(--green); stroke-width: 3; }
  .stage .ic-area-k  { fill: var(--grid); }
  .stage .ic-curve-k { fill: none; stroke: var(--ink); stroke-width: 3; }
  .stage .ic-tail  { fill: var(--red); fill-opacity: .6; }
  .stage .ic-seg   { stroke: var(--green); stroke-width: 4; }
  .stage .ic-br    { fill: none; stroke: var(--green); stroke-width: 4; }
  .stage .ic-seg.p, .stage .ic-br.p { stroke: var(--pop); }
  .stage .ic-dot   { fill: var(--green); }
  .stage .ic-box   { fill: var(--bg); stroke: var(--green); stroke-width: 2; }
  .stage .ic-box.p { stroke: var(--pop); }
  .stage .ic-musolid { stroke: var(--pop); stroke-width: 3; }
  .stage .ic-me      { stroke: var(--orange-dk); stroke-width: 3; }
  .stage .ic-msolid  { stroke: var(--green); stroke-width: 3.5; }
  .stage .ic-pt      { fill: var(--orange); stroke: var(--orange-dk); stroke-width: 2; }
  .stage .ic-pt.out  { fill: var(--red); stroke: #991B1B; }
  .stage .ic-arr     { stroke: var(--ink); stroke-width: 3; }
  .stage .est-box    { fill: var(--bg); stroke: var(--green); stroke-width: 3; }
  .stage .est-box.o  { stroke: var(--orange); }
  .stage .est-arr    { stroke: var(--ink); stroke-width: 2.5; }
  .stage .est-arr-h  { fill: var(--ink); }
  .stage .ret-seg    { stroke: var(--green); stroke-width: 3; }
  .stage .ret-dot    { fill: var(--green); }
  .stage .ret-seg.r  { stroke: var(--red); }
  .stage .ret-dot.r  { fill: var(--red); }
  .stage .est-arr2   { stroke: var(--pop); stroke-width: 2.5; stroke-dasharray: 8 6; }
  .stage .est-arr2-h { fill: var(--pop); }
  .stage .sqo.est    { fill: var(--green); stroke: #15803D; }
  .stage .bell.est, .stage .mline.est { stroke: var(--green); }
  .stage .bi-line    { fill: none; stroke-width: 3; }
  .stage .bi-pt      { fill: var(--bg); stroke-width: 3; }
  .stage .bi-line.o, .stage .bi-pt.o { stroke: var(--orange-dk); }
  .stage .bi-line.g, .stage .bi-pt.g { stroke: var(--green); }
  .stage .f-bullet   { fill: var(--pop); }
  .stage .ip-carto   { fill: var(--bg); stroke: var(--pop); stroke-width: 2.5; }
  .stage .ic-arr-h   { fill: var(--ink); }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    column-gap: 28px; padding: 18px 30px; pointer-events: none;
    font-size: 13px; letter-spacing: .08em; color: var(--ink);
  }
  #hud .counter { justify-self: start; min-width: 0; white-space: nowrap; font-variant-numeric: tabular-nums; opacity: .7; }
  #hud .counter #stepl { font-weight: 700; }
  #hud .station-name { justify-self: end; min-width: 0; max-width: 100%; text-align: right;
                       overflow: hidden; white-space: nowrap; text-overflow: ellipsis; opacity: .55; }
  #hud .station-key { font-weight: 700; }
  #rail { justify-self: center; display: flex; gap: 10px; pointer-events: auto; }
  #rail .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .22; cursor: pointer; transition: opacity .3s, transform .3s; }
  #rail .dot:hover { opacity: .6; }
  #rail .dot.active { opacity: 1; transform: scale(1.35); }
  #rail .dot.out { display: none; }
  #rail .dot.edge { opacity: .22; transform: scale(.62); }
  #railtip { position: fixed; bottom: 48px; transform: translateX(-50%); z-index: 51; background: var(--ink); color: var(--bg);
             font-size: 12px; padding: 6px 12px; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #railtip.show { opacity: 1; }
  .station-tag { position: absolute; top: 0; left: 0; pointer-events: none; white-space: nowrap; font-weight: 700; font-size: 84px;
                 letter-spacing: .04em; line-height: 1; color: var(--ink); opacity: 0; transition: opacity .4s ease; }
  .station-tag .tag-name { font-weight: 400; opacity: .45; }
  body.is-overview .station-tag { opacity: .7; }
  #fsbtn { position: fixed; top: 20px; right: 24px; pointer-events: auto; cursor: pointer; background: none; border: 0; padding: 8px;
           line-height: 0; color: currentColor; opacity: .45; transition: opacity .25s, transform .25s var(--ease-expo); }
  #fsbtn:hover, #fsbtn:focus-visible { opacity: 1; transform: scale(1.1); }
  #fsbtn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  #fsbtn svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #fsbtn .ic-exit { display: none; }
  body.is-fullscreen #fsbtn .ic-enter { display: none; }
  body.is-fullscreen #fsbtn .ic-exit { display: block; }

  /* ---------- edit mode ---------- */
  [hidden] { display: none !important; }
  #edbtn { position: fixed; top: 16px; right: 66px; pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 8px;
           background: var(--bg); border: 1px solid var(--grid); border-radius: 999px; padding: 7px 14px 7px 11px;
           font: 600 13px var(--font); color: var(--ink); box-shadow: 0 2px 10px rgba(31,41,55,.08); transition: border-color .2s; }
  #edbtn::after { content: "Éditer"; }
  #edbtn:hover { border-color: var(--ink); }
  #edbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  #edbtn svg { width: 16px; height: 16px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  body.editing #edbtn { display: none; }
  #edbar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 70; max-width: calc(100vw - 140px);
           display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 8px 12px;
           background: var(--bg); border: 1px solid var(--grid); border-radius: 10px; box-shadow: 0 6px 24px rgba(31,41,55,.14);
           font: 500 13px var(--font); color: var(--ink); }
  #edbar .grp { display: flex; align-items: center; gap: 6px; }
  #edbar button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--grid); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #edbar button:hover { border-color: var(--ink); }
  #edbar button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  #edbar button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #edbar button.armed { border-color: var(--orange-dk); color: var(--orange-dk); }
  #edbar .sw { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--grid); }
  #edbar .sel-only { display: none; }
  #edbar.has-sel .sel-only { display: flex; }
  #edbar.has-sel:not(.is-text) .text-only { display: none; }
  #edbar .hint { flex-basis: 100%; text-align: center; font-size: 12px; font-weight: 400; color: var(--pop); }
  #edbar .hint b { font-weight: 600; color: var(--ink); }
  #edsel { position: fixed; z-index: 65; pointer-events: none; outline: 2px dashed var(--orange-dk); outline-offset: 4px; border-radius: 2px; }
  #edtext { position: fixed; z-index: 75; font-family: var(--font); color: var(--ink); background: var(--bg);
            padding: 2px 8px; border: 2px solid var(--orange-dk); border-radius: 6px; outline: none; }
  body.editing .stage * { cursor: move; }
  body.editing .stage text, body.editing .stage tspan { cursor: text; }

  #swipehint { position: fixed; left: 50%; bottom: 64px; z-index: 60; pointer-events: none; font-weight: 600; font-size: 12px;
               letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 10px 18px;
               border-radius: 999px; opacity: 0; transform: translateX(-50%); animation: swipehint 5s ease 1.1s forwards; }
  @keyframes swipehint { 0% { opacity: 0; transform: translate(-50%, 10px); } 12%, 78% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -8px); } }
  @media (pointer: coarse) {
    #railtip { display: none; }
    #fsbtn svg { width: 28px; height: 28px; }
    #fsbtn { animation: fs-nudge 1.5s ease 1.8s 3; }
  }
  @keyframes fs-nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
  @media (max-width: 760px), (max-height: 500px) {
    #hud { font-size: 10px; column-gap: 14px;
           padding: 10px calc(14px + env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px)); }
    #fsbtn { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); }
    #rail { gap: 5px; }
    #rail .dot { width: 5px; height: 5px; }
  }
  #rotatehint { display: none; position: fixed; inset: 0; z-index: 90; background: var(--bg); color: var(--ink);
                flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center; cursor: pointer; }
  @media (pointer: coarse) and (orientation: portrait) and (max-width: 760px) { body:not(.rh-dismissed) #rotatehint { display: flex; } }
  #rotatehint .rh-phone { width: 60px; height: 60px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
                          animation: rh-turn 2.8s var(--ease-expo) infinite; }
  @keyframes rh-turn { 0%, 22% { transform: rotate(0); } 55%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  #rotatehint .rh-title { font-weight: 700; line-height: .95; letter-spacing: -.02em; font-size: 15vw; }
  #rotatehint .rh-sub { font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; max-width: 80vw; line-height: 1.7; }
  #rotatehint .rh-nofs { display: none; }
  body.no-fullscreen #rotatehint .rh-fs { display: none; }
  body.no-fullscreen #rotatehint .rh-nofs { display: inline; }
</style>
